# Nginx reverse-proxy configuration for api.vikoba360.com
# Include this server/location configuration in the production Nginx site.

server {
    listen 443 ssl http2;
    server_name api.vikoba360.com;

    # Must be at least as large as Spring's multipart max-request-size.
    # This prevents Nginx from returning 413 before Spring receives the upload.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
