spring.application.name=vikoba-test
spring.profiles.active=test

# H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway & Session disabled for test context
spring.flyway.enabled=false
spring.session.store-type=none

# Kafka for test
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=5000

# Security & App
security.jwt.secret-key=NDb+ckkYVWyRqx5PI+DuaienbdfryWQI6kquJJI0ac8=
security.jwt.expiration-time=3600000
jwt.refreshExpirationMs=2592000000
sms.secret.key=test-sms-secret
sms.sender.id=Pago
sms.dispatch.url=https://api.pago.co.tz/api/v1/sms/dispatch
app.cors.allowed-origins=http://localhost:3000
