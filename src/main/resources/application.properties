spring.application.name=vikoba
spring.profiles.active=dev

# Zalando Logbook HTTP request/response logging.
logging.level.org.zalando.logbook=TRACE
# Kafka periodically logs admin metadata bootstrap retries at INFO when the broker is unavailable.
logging.level.org.apache.kafka.clients.admin.internals.AdminMetadataManager=WARN
logbook.filter.enabled=true
logbook.secure-filter.enabled=true
logbook.format.style=http
logbook.write.status-code-based=true
logbook.write.max-body-size=4096
logbook.obfuscate.replacement=REDACTED
logbook.obfuscate.headers=Authorization,Cookie,Set-Cookie,X-API-Key
logbook.obfuscate.parameters=password,code,otp,token,access_token,refresh_token,phone,email
logbook.obfuscate.json-body-fields=password,code,otp,token,accessToken,access_token,refreshToken,refresh_token,secret,clientSecret,apiKey,phone,email,fullName,firstName,lastName,nationalId

# Shared Kafka settings; each profile supplies its broker address.
spring.kafka.admin.fail-fast=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=5000

# WhatsApp Cloud API OTP delivery. Keep credentials in the runtime environment.
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.otp-template=${WHATSAPP_OTP_TEMPLATE:}
whatsapp.otp-template-language=${WHATSAPP_OTP_TEMPLATE_LANGUAGE:en_US}
whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v27.0}
