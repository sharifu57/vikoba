server.port=8050
server.address=0.0.0.0
spring.config.import=optional:file:./.env[.properties]

app.version=1.0.1

# PostgreSQL
#spring.datasource.url=jdbc:postgresql://postgres:5432/vk360
#spring.datasource.username=vk360

spring.datasource.url=jdbc:postgresql://postgres:5432/vk360
spring.datasource.username=vk360
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=vikoba360

# Session
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
jwt.refreshExpirationMs=2592000000

# HTTP
http.secure.value=false
same.site=Lax

# SMS
sms.secret.key=${SMS_API_KEY:}
sms.sender.id=Pago
sms.dispatch.url=https://api.pago.co.tz/api/v1/sms/dispatch

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://vikoba360.com,https://www.vikoba360.com}

