server.port=8050
server.address=0.0.0.0

app.version=${APP_VERSION:1.0.1}

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/vk360
spring.datasource.username=vk360
spring.datasource.password=${DATABASE_PASSWORD}

spring.data.redis.host=redis
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=kafka:9092

# Hikari
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# Redis
spring.data.redis.password=${REDIS_PASSWORD}

# Kafka
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:vikoba360}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# Session
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# HTTP / Cookies
http.secure.value=${HTTP_SECURE_VALUE:false}
same.site=${SAME_SITE:Lax}

# SMS
sms.secret.key=${SMS_SECRET_KEY}
sms.sender.id=${SMS_SENDER_ID:Pago}
sms.dispatch.url=${SMS_DISPATCH_URL}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ClickPesa
clickpesa.client-id=${CLICKPESA_CLIENT_ID:}
clickpesa.api-key=${CLICKPESA_API_KEY:}