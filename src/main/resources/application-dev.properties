server.port=8050
server.address=0.0.0.0
#server.servlet.context-path=/gng/api/v1
app.version=1.0.1

spring.datasource.url=jdbc:postgresql://172.232.161.163:5432/genge
spring.datasource.username=genge
spring.datasource.password=${DB_PASSWORD:}
#spring.session.store-type=none

#spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.boot=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.tool.schema=DEBUG
spring.session.store-type=jdbc


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.session.jdbc.initialize-schema=never
#spring.session.store-type=none

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jpa.open-in-view=false

# ===============================
# JWT Security
# ===============================
security.jwt.secret-key=${JWT_SECRET_KEY:}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:2592000000}

http.secure.value=false
same.site=Lax


sms.secret.key=${SMS_SECRET_KEY:}
sms.sender.id=${SMS_SENDER_ID:Pago}
sms.dispatch.url=${SMS_DISPATCH_URL:https://api.pago.co.tz/api/v1/sms/dispatch}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Payment provider credentials (supply through environment variables)
clickpesa.client-id=${CLICKPESA_CLIENT_ID:}
clickpesa.api-key=${CLICKPESA_API_KEY:}
